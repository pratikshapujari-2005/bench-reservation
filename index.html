<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Classroom Bench Reservation</title>
    <style>
      :root {
        --bg: #f8fafc;
        --card-bg: #ffffff;
        --primary: #2563eb;
        --primary-hover: #1d4ed8;
        --disabled: #94a3b8;
        --available: #e2e8f0;
        --available-border: #cbd5e1;
        --selected: #22c55e;
        --booked: #ef4444;
        --text: #0f172a;
      }

      body {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        background-color: var(--bg);
        color: var(--text);
        margin: 0;
        padding: 24px 16px 60px 16px;
        display: flex;
        justify-content: center;
        min-height: 100vh;
        box-sizing: border-box;
        position: relative;
      }

      .container {
        max-width: 900px;
        width: 100%;
        background: var(--card-bg);
        border-radius: 12px;
        padding: 24px;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        height: fit-content;
      }

      h1 {
        margin-top: 0;
        text-align: center;
        font-size: 1.5rem;
      }

      .session-info {
        text-align: center;
        font-weight: bold;
        color: #475569;
        margin-bottom: 12px;
        font-size: 0.95rem;
      }

      .time-banner {
        padding: 10px;
        border-radius: 6px;
        text-align: center;
        font-weight: 600;
        font-size: 0.85rem;
        margin-bottom: 20px;
      }

      .controls {
        display: flex;
        gap: 16px;
        margin-bottom: 20px;
        flex-wrap: wrap;
      }

      .control-group {
        flex: 1;
        min-width: 180px;
      }

      label {
        display: block;
        font-size: 0.85rem;
        font-weight: 600;
        margin-bottom: 6px;
      }

      select,
      input {
        width: 100%;
        padding: 10px;
        border-radius: 6px;
        border: 1px solid #cbd5e1;
        font-size: 0.95rem;
        box-sizing: border-box;
      }

      .blackboard {
        background: #334155;
        color: white;
        text-align: center;
        padding: 10px;
        border-radius: 6px;
        font-weight: bold;
        letter-spacing: 1px;
        margin-bottom: 24px;
        font-size: 0.9rem;
      }

      /* Grid Layout with vertical aisles */
      .grid-container {
        display: grid;
        grid-template-columns: 1fr 1fr 20px 1fr 1fr 20px 1fr 1fr 20px 1fr;
        gap: 12px 8px;
        margin-bottom: 24px;
      }

      .bench {
        height: 48px;
        border-radius: 6px;
        border: 2px solid var(--available-border);
        background-color: var(--available);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.75rem;
        font-weight: 600;
        cursor: pointer !important;
        user-select: none;
        transition:
          transform 0.1s,
          background-color 0.2s;
        box-sizing: border-box;
        padding: 4px;
        text-align: center;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        position: relative;
        z-index: 10;
      }

      .bench:hover:not(.booked):not(.disabled) {
        transform: translateY(-2px);
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      }

      .bench.selected {
        background-color: var(--selected) !important;
        color: white !important;
        border-color: #16a34a !important;
      }

      .bench.booked {
        background-color: var(--booked) !important;
        color: white !important;
        border-color: #dc2626 !important;
        cursor: not-allowed !important;
        font-size: 0.7rem;
      }

      .bench.disabled {
        cursor: not-allowed !important;
        opacity: 0.6;
      }

      .column-aisle {
        pointer-events: none;
      }

      .legend {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-bottom: 20px;
        font-size: 0.85rem;
      }

      .legend-item {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .legend-box {
        width: 20px;
        height: 14px;
        border-radius: 3px;
      }

      .btn {
        width: 100%;
        background-color: var(--primary);
        color: white;
        padding: 12px;
        border: none;
        border-radius: 6px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
      }

      .btn:hover:not(:disabled) {
        background-color: var(--primary-hover);
      }

      .btn:disabled {
        background-color: var(--disabled);
        cursor: not-allowed;
      }

      .status-msg {
        margin-top: 12px;
        text-align: center;
        font-size: 0.9rem;
        font-weight: 500;
      }

      .creator-tag {
        position: fixed;
        bottom: 16px;
        left: 16px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #64748b;
        background: #ffffff;
        padding: 6px 12px;
        border-radius: 20px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        border: 1px solid #e2e8f0;
        z-index: 1000;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Daily Bench Reservation</h1>
      <div class="session-info">Daily Timing: 08:00 AM – 04:30 PM</div>

      <div id="time-banner" class="time-banner">Checking status...</div>

      <div class="controls">
        <div class="control-group">
          <label for="class-select">Select Class:</label>
          <select id="class-select">
            <option value="5A">Class 5A</option>
            <option value="5B">Class 5B</option>
            <option value="5C">Class 5C</option>
          </select>
        </div>

        <div class="control-group">
          <label for="student-id">Student ID / Name:</label>
          <input type="text" id="student-id" placeholder="e.g. John Doe" />
        </div>
      </div>

      <div class="blackboard">BLACKBOARD / STAGE</div>

      <div id="grid" class="grid-container"></div>

      <div class="legend">
        <div class="legend-item">
          <div
            class="legend-box"
            style="
              background: var(--available);
              border: 1px solid var(--available-border);
            "
          ></div>
          Available Bench
        </div>
        <div class="legend-item">
          <div class="legend-box" style="background: var(--selected)"></div>
          Selected
        </div>
        <div class="legend-item">
          <div class="legend-box" style="background: var(--booked)"></div>
          Reserved
        </div>
      </div>

      <button class="btn" id="reserve-btn">Confirm Bench Reservation</button>
      <div id="status-msg" class="status-msg"></div>
    </div>

    <div class="creator-tag">Created by Pratiksha G Pujari</div>

<script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
      import {
        getDatabase,
        ref,
        set,
        onValue,
      } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

      const firebaseConfig = {
        apiKey: "AIzaSyBWBKdV7V1BeG0oBi9izMQuOFCl6XX20cs",
        authDomain: "classbench-c6ba9.firebaseapp.com",
        databaseURL:
          "https://classbench-c6ba9-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "classbench-c6ba9",
        storageBucket: "classbench-c6ba9.firebasestorage.app",
        messagingSenderId: "79637397030",
        appId: "1:79637397030:web:063f3ef85c5f10b1d2b0e7",
      };

      const app = initializeApp(firebaseConfig);
      const database = getDatabase(app);

      const ROWS = 6;
      const COLS = 7;
      const START_HOUR = 8;     // 08:00 AM
      const END_HOUR = 16;      // 04:00 PM
      const END_MINUTE = 30;    // :30 PM

      const classSelect = document.getElementById("class-select");
      const studentInput = document.getElementById("student-id");
      const gridContainer = document.getElementById("grid");
      const reserveBtn = document.getElementById("reserve-btn");
      const statusMsg = document.getElementById("status-msg");
      const timeBanner = document.getElementById("time-banner");

      let selectedBenchIndex = null;
      let liveBookings = {};
      let unsubscribe = null;

      function getTodayString() {
        const now = new Date();
        return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;
      }

      // --- DEVICE-BASED DAILY BOOKING COUNTER ---
      function getDeviceBookingCount() {
        const today = getTodayString();
        const storedDate = localStorage.getItem("device_booking_date");
        
        // Reset counter if it's a new day
        if (storedDate !== today) {
          localStorage.setItem("device_booking_date", today);
          localStorage.setItem("device_booking_count", "0");
          return 0;
        }
        
        return parseInt(localStorage.getItem("device_booking_count") || "0", 10);
      }

      function incrementDeviceBookingCount() {
        const current = getDeviceBookingCount();
        localStorage.setItem("device_booking_count", (current + 1).toString());
      }

      function isBookingOpen() {
        const now = new Date();
        const currentHour = now.getHours();
        const currentMinute = now.getMinutes();

        const afterStart = currentHour >= START_HOUR;
        const beforeEnd =
          currentHour < END_HOUR ||
          (currentHour === END_HOUR && currentMinute <= END_MINUTE);

        return afterStart && beforeEnd;
      }

      function updateTimeStatus() {
        const open = isBookingOpen();
        const deviceCount = getDeviceBookingCount();

        if (!open) {
          timeBanner.textContent = `🔒 Reservations closed for today.`;
          timeBanner.style.backgroundColor = "#fef3c7";
          timeBanner.style.color = "#b45309";
          reserveBtn.disabled = true;
        } else if (deviceCount >= 2) {
          timeBanner.textContent = `⚠️ Daily Limit Reached: You have already made 2 reservations from this device today.`;
          timeBanner.style.backgroundColor = "#fee2e2";
          timeBanner.style.color = "#991b1b";
          reserveBtn.disabled = true;
        } else {
          timeBanner.textContent = `🟢 Reservations OPEN (${getTodayString()}) — Benches booked from this device: ${deviceCount}/2`;
          timeBanner.style.backgroundColor = "#dcfce7";
          timeBanner.style.color = "#15803d";
          reserveBtn.disabled = false;
        }
      }

      function renderGrid() {
        gridContainer.innerHTML = "";
        const open = isBookingOpen();
        const deviceCount = getDeviceBookingCount();

        for (let r = 1; r <= ROWS; r++) {
          for (let c = 1; c <= COLS; c++) {
            const index = (r - 1) * COLS + (c - 1);
            const bench = document.createElement("div");
            bench.classList.add("bench");
            bench.setAttribute("data-index", index);

            if (selectedBenchIndex === index) {
              bench.classList.add("selected");
            }

            if (liveBookings[index]) {
              bench.classList.add("booked");
              bench.textContent = liveBookings[index].student;
              bench.title = `Reserved by: ${liveBookings[index].student} at ${liveBookings[index].time}`;
            } else {
              bench.textContent = `Bench R${r}C${c}`;
              if (!open || deviceCount >= 2) {
                bench.classList.add("disabled");
              } else {
                bench.onclick = (e) => {
                  e.stopPropagation();
                  selectBench(index);
                };
              }
            }

            gridContainer.appendChild(bench);

            if (c === 2 || c === 4 || c === 6) {
              const aisle = document.createElement("div");
              aisle.classList.add("column-aisle");
              gridContainer.appendChild(aisle);
            }
          }
        }
      }

      function selectBench(index) {
        if (!isBookingOpen() || getDeviceBookingCount() >= 2) return;

        if (selectedBenchIndex === index) {
          selectedBenchIndex = null;
        } else {
          selectedBenchIndex = index;
        }

        renderGrid();
      }

      function subscribeToRealtimeDatabase() {
        if (unsubscribe) unsubscribe();

        const today = getTodayString();
        const selectedClass = classSelect.value;
        const dbRef = ref(database, `benches/${today}/${selectedClass}`);

        unsubscribe = onValue(
          dbRef,
          (snapshot) => {
            liveBookings = snapshot.val() || {};
            renderGrid();
          },
          (error) => {
            showStatus(
              "Database connection error: " + error.message,
              "#ef4444",
            );
          },
        );
      }

      // --- RESERVATION ACTION ---
      reserveBtn.addEventListener("click", () => {
        const studentName = studentInput.value.trim();
        const deviceCount = getDeviceBookingCount();

        // 1. CHECK DEVICE LIMIT
        if (deviceCount >= 2) {
          showStatus("❌ Limit reached! You cannot book more than 2 benches per day from this device.", "#ef4444");
          return;
        }

        if (!studentName) {
          showStatus("Please enter the student's name or ID.", "#ef4444");
          return;
        }

        if (selectedBenchIndex === null) {
          showStatus("Please select an available bench.", "#ef4444");
          return;
        }

        if (liveBookings[selectedBenchIndex]) {
          showStatus("Sorry, someone just booked this bench!", "#ef4444");
          return;
        }

        const row = Math.floor(selectedBenchIndex / COLS) + 1;
        const col = (selectedBenchIndex % COLS) + 1;
        const today = getTodayString();
        const selectedClass = classSelect.value;

        const seatRef = ref(
          database,
          `benches/${today}/${selectedClass}/${selectedBenchIndex}`,
        );

        set(seatRef, {
          student: studentName,
          time: new Date().toLocaleTimeString(),
        })
          .then(() => {
            // INCREMENT DEVICE LOCK COUNTER
            incrementDeviceBookingCount();
            const newCount = getDeviceBookingCount();

            showStatus(
              `✅ Reserved Bench R${row}C${col} for ${studentName}! (${newCount}/2 bookings used on this device today)`,
              "#22c55e",
            );
            
            studentInput.value = "";
            selectedBenchIndex = null;
            updateTimeStatus();
            renderGrid();
          })
          .catch((err) => {
            showStatus("Failed to reserve: " + err.message, "#ef4444");
          });
      });

      function showStatus(msg, color) {
        statusMsg.textContent = msg;
        statusMsg.style.color = color;
      }

      classSelect.addEventListener("change", () => {
        statusMsg.textContent = "";
        selectedBenchIndex = null;
        subscribeToRealtimeDatabase();
      });

      // Start App
      updateTimeStatus();
      renderGrid();
      subscribeToRealtimeDatabase();
      setInterval(updateTimeStatus, 30000);
    </script>
  </body>
</html>
